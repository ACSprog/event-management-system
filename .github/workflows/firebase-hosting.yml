# Test environment (event-management-system-test on Firebase Hosting):
#   every push to master, plus a 7-day preview link for each pull request.
# Live environment (event-management-system) is hosted by the owner:
#   publishing a GitHub release attaches a ready-to-host package (event-management-system-web-<tag>.zip).
# Secret needed: FIREBASE_SERVICE_ACCOUNT_TEST (see README, "Hosting").
name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Deploy to test
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEST }}
          projectId: event-management-system-test
          channelId: ${{ github.event_name == 'pull_request' && '' || 'live' }}
          expires: 7d

  release-package:
    name: Package for live (owner-hosted)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Zip the site
        run: |
          cp HOSTING.md out/HOSTING.md
          cd out && zip -qr "../event-management-system-web-${{ github.event.release.tag_name }}.zip" .
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "event-management-system-web-${{ github.event.release.tag_name }}.zip" --clobber
